<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unshakable You — Digital Postcards</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Unbounded:wght@300;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0d0d0d;
    --cream: #f5f0e8;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --charcoal: #1a1a1a;
    --mist: #e8e4dc;
    --ember: #c45c3a;
    --slate: #2c3340;
  }

  body {
    background: var(--ink);
    font-family: 'DM Mono', monospace;
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    padding: 3rem 2rem 2rem;
    text-align: center;
    position: relative;
  }

  header::after {
    content: '';
    display: block;
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 1.5rem auto 0;
  }

  .brand {
    font-family: 'Unbounded', sans-serif;
    font-weight: 300;
    font-size: clamp(0.6rem, 2vw, 0.75rem);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.75rem;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2rem, 5vw, 3.5rem);
    letter-spacing: 0.02em;
    color: var(--cream);
    line-height: 1.1;
  }

  h1 em {
    font-style: italic;
    color: var(--gold-light);
  }

  .subtitle {
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    color: #888;
    margin-top: 0.75rem;
    text-transform: uppercase;
  }

  /* CONTROLS */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
    padding: 1.5rem 2rem;
    max-width: 900px;
    margin: 0 auto;
  }

  .theme-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.5rem 1rem;
    border: 1px solid #333;
    background: transparent;
    color: #888;
    cursor: pointer;
    transition: all 0.3s ease;
    border-radius: 2px;
  }

  .theme-btn:hover, .theme-btn.active {
    border-color: var(--gold);
    color: var(--gold);
  }

  /* CARD WRAPPER */
  .card-stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem 1.5rem 3rem;
    gap: 2rem;
  }

  /* NAVIGATION */
  .nav-row {
    display: flex;
    align-items: center;
    gap: 2rem;
  }

  .nav-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.6rem 1.5rem;
    border: 1px solid #444;
    background: transparent;
    color: var(--cream);
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 2px;
  }

  .nav-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .quote-counter {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: #555;
  }

  /* THE POSTCARD */
  .postcard-wrap {
    width: 100%;
    max-width: 640px;
    position: relative;
  }

  .postcard {
    width: 100%;
    aspect-ratio: 1 / 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 3rem;
    overflow: hidden;
    transition: all 0.5s ease;
    cursor: default;
    border-radius: 4px;
  }

  /* ── THEME 1: DARK GOLD (default) ── */
  .theme-darkgold {
    background: #0f0e0b;
    border: 1px solid #2a2418;
  }

  .theme-darkgold::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(201,168,76,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(201,168,76,0.06) 0%, transparent 50%);
  }

  .theme-darkgold .card-frame {
    border-color: rgba(201,168,76,0.3);
  }

  .theme-darkgold .quote-text {
    color: var(--cream);
  }

  .theme-darkgold .quote-mark {
    color: var(--gold);
    opacity: 0.4;
  }

  .theme-darkgold .card-brand {
    color: var(--gold);
  }

  .theme-darkgold .card-tagline {
    color: #5a5040;
  }

  /* ── THEME 2: CREAM EDITORIAL ── */
  .theme-cream {
    background: #f7f3eb;
    border: 1px solid #e0d8c8;
  }

  .theme-cream::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 80% 10%, rgba(196,92,58,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 10% 90%, rgba(201,168,76,0.1) 0%, transparent 50%);
  }

  .theme-cream .card-frame {
    border-color: rgba(0,0,0,0.12);
  }

  .theme-cream .quote-text {
    color: #1a1612;
  }

  .theme-cream .quote-mark {
    color: var(--ember);
    opacity: 0.3;
  }

  .theme-cream .card-brand {
    color: var(--ember);
  }

  .theme-cream .card-tagline {
    color: #b0a898;
  }

  /* ── THEME 3: SLATE NIGHT ── */
  .theme-slate {
    background: #1c2230;
    border: 1px solid #252e40;
  }

  .theme-slate::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(100,140,200,0.1) 0%, transparent 60%),
      radial-gradient(ellipse at 90% 100%, rgba(201,168,76,0.08) 0%, transparent 50%);
  }

  .theme-slate .card-frame {
    border-color: rgba(100,140,200,0.2);
  }

  .theme-slate .quote-text {
    color: #dce4f0;
  }

  .theme-slate .quote-mark {
    color: #6490cc;
    opacity: 0.35;
  }

  .theme-slate .card-brand {
    color: #6490cc;
  }

  .theme-slate .card-tagline {
    color: #3a4560;
  }

  /* ── THEME 4: EMBER / WARM DARK ── */
  .theme-ember {
    background: #140c08;
    border: 1px solid #2a1810;
  }

  .theme-ember::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 30%, rgba(196,92,58,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(196,92,58,0.08) 0%, transparent 50%);
  }

  .theme-ember .card-frame {
    border-color: rgba(196,92,58,0.25);
  }

  .theme-ember .quote-text {
    color: #f0e4da;
  }

  .theme-ember .quote-mark {
    color: var(--ember);
    opacity: 0.4;
  }

  .theme-ember .card-brand {
    color: #e08060;
  }

  .theme-ember .card-tagline {
    color: #4a2e20;
  }

  /* ── THEME 5: PURE MINIMAL ── */
  .theme-minimal {
    background: #ffffff;
    border: 1px solid #e8e8e8;
  }

  .theme-minimal::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.015) 0%, transparent 100%);
  }

  .theme-minimal .card-frame {
    border-color: rgba(0,0,0,0.08);
  }

  .theme-minimal .quote-text {
    color: #111;
  }

  .theme-minimal .quote-mark {
    color: #111;
    opacity: 0.12;
  }

  .theme-minimal .card-brand {
    color: #111;
  }

  .theme-minimal .card-tagline {
    color: #ccc;
  }

  /* CARD INNER ELEMENTS */
  .card-frame {
    position: absolute;
    inset: 18px;
    border: 1px solid;
    pointer-events: none;
    border-radius: 2px;
  }

  .card-corner {
    position: absolute;
    width: 12px;
    height: 12px;
    border-color: inherit;
    border-style: solid;
  }

  .card-corner.tl { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .card-corner.tr { top: -1px; right: -1px; border-width: 1px 1px 0 0; }
  .card-corner.bl { bottom: -1px; left: -1px; border-width: 0 0 1px 1px; }
  .card-corner.br { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

  .quote-mark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 8rem;
    line-height: 0.6;
    position: absolute;
    top: 2.5rem;
    left: 2.8rem;
    font-weight: 300;
    user-select: none;
  }

  .quote-content {
    position: relative;
    z-index: 2;
    text-align: center;
    max-width: 480px;
  }

  .quote-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.25rem, 3.5vw, 1.75rem);
    font-weight: 400;
    line-height: 1.55;
    font-style: italic;
    letter-spacing: 0.01em;
  }

  .quote-divider {
    width: 32px;
    height: 1px;
    background: currentColor;
    opacity: 0.25;
    margin: 1.5rem auto;
  }

  .card-brand {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 0.5rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
  }

  .card-tagline {
    font-family: 'DM Mono', monospace;
    font-size: 0.5rem;
    letter-spacing: 0.2em;
    margin-top: 0.4rem;
    text-transform: uppercase;
  }

  .quote-number {
    position: absolute;
    bottom: 1.6rem;
    right: 2.2rem;
    font-size: 0.5rem;
    letter-spacing: 0.2em;
    opacity: 0.25;
    font-family: 'DM Mono', monospace;
  }

  /* FADE ANIMATION */
  .postcard.fade-out {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .postcard.fade-in {
    animation: fadeUp 0.4s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* DOWNLOAD BTN */
  .action-row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .dl-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 0.75rem 2rem;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 2px;
  }

  .dl-btn:hover {
    background: var(--gold);
    color: var(--ink);
  }

  .copy-btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 0.75rem 2rem;
    border: 1px solid #444;
    background: transparent;
    color: #888;
    cursor: pointer;
    transition: all 0.3s;
    border-radius: 2px;
  }

  .copy-btn:hover {
    border-color: #888;
    color: var(--cream);
  }

  /* QUOTE GRID PREVIEW */
  .all-quotes {
    max-width: 700px;
    width: 100%;
    padding: 0 1.5rem;
  }

  .all-quotes-title {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #444;
    margin-bottom: 1rem;
    text-align: center;
  }

  .quote-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
  }

  .q-pill {
    font-size: 0.55rem;
    letter-spacing: 0.1em;
    padding: 0.35rem 0.75rem;
    border: 1px solid #2a2a2a;
    border-radius: 100px;
    color: #555;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    font-family: 'DM Mono', monospace;
  }

  .q-pill:hover, .q-pill.active {
    border-color: var(--gold);
    color: var(--gold);
  }

  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--gold);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 0.6rem 1.5rem;
    border-radius: 2px;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 999;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  hr.section-divide {
    border: none;
    border-top: 1px solid #1a1a1a;
    max-width: 400px;
    margin: 0.5rem auto;
  }
</style>
</head>
<body>

<header>
  <div class="brand">A.B. Mustikin</div>
  <h1>Unshakable <em>You</em></h1>
  <div class="subtitle">Digital Postcard Collection · 20 Quotes</div>
</header>

<!-- THEME SELECTOR -->
<div class="controls">
  <button class="theme-btn active" onclick="setTheme('darkgold', this)">Dark Gold</button>
  <button class="theme-btn" onclick="setTheme('cream', this)">Cream</button>
  <button class="theme-btn" onclick="setTheme('slate', this)">Slate Night</button>
  <button class="theme-btn" onclick="setTheme('ember', this)">Ember</button>
  <button class="theme-btn" onclick="setTheme('minimal', this)">Minimal</button>
</div>

<div class="card-stage">

  <!-- POSTCARD -->
  <div class="postcard-wrap">
    <div class="postcard theme-darkgold fade-in" id="postcard">
      <div class="card-frame">
        <div class="card-corner tl"></div>
        <div class="card-corner tr"></div>
        <div class="card-corner bl"></div>
        <div class="card-corner br"></div>
      </div>
      <div class="quote-mark">"</div>
      <div class="quote-content">
        <div class="quote-text" id="quote-text"></div>
        <div class="quote-divider"></div>
        <div class="card-brand">Unshakable You</div>
        <div class="card-tagline">unshakableyoujourney.substack.com</div>
      </div>
      <div class="quote-number" id="quote-number">01 / 20</div>
    </div>
  </div>

  <!-- NAV -->
  <div class="nav-row">
    <button class="nav-btn" onclick="prevQuote()">← Prev</button>
    <span class="quote-counter" id="counter-label">01 of 20</span>
    <button class="nav-btn" onclick="nextQuote()">Next →</button>
  </div>

  <!-- ACTIONS -->
  <div class="action-row">
    <button class="dl-btn" onclick="downloadCard()">↓ Save as Image</button>
    <button class="copy-btn" onclick="copyQuote()">Copy Quote Text</button>
  </div>

  <hr class="section-divide">

  <!-- QUOTE PILLS -->
  <div class="all-quotes">
    <div class="all-quotes-title">Jump to quote</div>
    <div class="quote-pills" id="pill-container"></div>
  </div>

</div>

<div class="toast" id="toast">Copied!</div>

<!-- html2canvas for download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
const quotes = [
  "You don't find yourself. You decide who you're becoming — then you show up for that person.",
  "Waiting for someone to tell you you're ready? That's the old you. The new you just starts.",
  "Every small choice you make today is a vote for the person you're becoming.",
  "You don't have to be at your best every day. Just don't stop completely. Even 1% counts.",
  "Some days surviving is the win. Keep the light on — that's enough.",
  "Slipping up once doesn't make you a failure. Giving up after the slip does.",
  "Missing one day is human. Missing two becomes a habit. Catch yourself at one.",
  "Starting over isn't losing. It's the bravest move you can make.",
  "You fell. That's okay. The only real question is: what do you do next?",
  "You don't figure yourself out in the easy moments. You figure it out when it gets hard.",
  "You can't protect who you are if you don't know who you are. Know yourself first.",
  "Being unshakable doesn't mean nothing moves you. It means you always find your way back.",
  "The hard times aren't the problem. Not knowing who you are in them — that's the real problem.",
  "The person you keep doubting? They've gotten through every hard day so far. Trust that.",
  "You already have more proof than you think. Look at everything you've survived.",
  "Perfect is a trap. Done, again and again, is how real change happens.",
  "You don't need motivation every day. You need a decision you made once and keep honouring.",
  "Growth isn't always visible. Sometimes it's just you, quietly not quitting.",
  "Who you are when no one's watching — that's the real you. Build that person first.",
  "You are not stuck. You are between versions of yourself. Keep going."
];

let currentIndex = 0;
let currentTheme = 'darkgold';

function renderCard(idx) {
  const card = document.getElementById('postcard');
  const text = document.getElementById('quote-text');
  const num = document.getElementById('quote-number');
  const counter = document.getElementById('counter-label');

  card.classList.add('fade-out');
  setTimeout(() => {
    text.textContent = quotes[idx];
    const n = String(idx + 1).padStart(2, '0');
    num.textContent = `${n} / 20`;
    counter.textContent = `${n} of 20`;
    updatePills(idx);
    card.classList.remove('fade-out');
    card.classList.remove('fade-in');
    void card.offsetWidth;
    card.classList.add('fade-in');
  }, 200);
}

function nextQuote() {
  currentIndex = (currentIndex + 1) % quotes.length;
  renderCard(currentIndex);
}

function prevQuote() {
  currentIndex = (currentIndex - 1 + quotes.length) % quotes.length;
  renderCard(currentIndex);
}

function goToQuote(idx) {
  currentIndex = idx;
  renderCard(idx);
}

function setTheme(theme, btn) {
  const card = document.getElementById('postcard');
  card.className = `postcard theme-${theme}`;
  currentTheme = theme;
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function buildPills() {
  const container = document.getElementById('pill-container');
  quotes.forEach((q, i) => {
    const btn = document.createElement('button');
    btn.className = 'q-pill' + (i === 0 ? ' active' : '');
    btn.textContent = String(i + 1).padStart(2, '0');
    btn.title = q.substring(0, 50) + '...';
    btn.onclick = () => goToQuote(i);
    container.appendChild(btn);
  });
}

function updatePills(idx) {
  document.querySelectorAll('.q-pill').forEach((p, i) => {
    p.classList.toggle('active', i === idx);
  });
}

function copyQuote() {
  const text = quotes[currentIndex];
  const full = `"${text}"\n\n— Unshakable You by A.B. Mustikin\nunshakableyoujourney.substack.com`;
  navigator.clipboard.writeText(full).then(() => showToast('Copied to clipboard!'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function downloadCard() {
  const card = document.getElementById('postcard');
  showToast('Preparing image…');
  html2canvas(card, {
    scale: 3,
    useCORS: true,
    backgroundColor: null,
    logging: false
  }).then(canvas => {
    const link = document.createElement('a');
    const n = String(currentIndex + 1).padStart(2, '0');
    link.download = `unshakable-you-quote-${n}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('Saved!');
  });
}

// INIT
buildPills();
renderCard(0);

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextQuote();
  if (e.key === 'ArrowLeft') prevQuote();
});
</script>
</body>
</html>
